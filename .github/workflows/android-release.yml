name: Android APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (default: release tag / manifest)"
        required: false
      release_tag:
        description: "Upload APK to this existing release tag (optional)"
        required: false

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;36.1.0" >/dev/null

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version and versionCode
        run: |
          TAG="${{ github.event.release.tag_name }}"
          [ -n "$TAG" ] || TAG="${{ inputs.release_tag }}"
          VER="${{ inputs.version_name }}"
          if [ -z "$VER" ] && [ -n "$TAG" ]; then VER="${TAG#v}"; fi
          if [ -z "$VER" ]; then
            VER=$(python3 -c "import json;print(json.load(open('custom_components/cartelemetry/manifest.json'))['version'])")
          fi
          # Local builds use build_counter.txt (private repo). CI reserves 100000+
          # so a CI build never downgrades an installed local build.
          echo "$((100000 + ${{ github.run_number }}))" > Car2Hass/build_counter.txt
          echo "VERSION_NAME=$VER" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Building $VER (versionCode $(cat Car2Hass/build_counter.txt)) tag=$TAG"

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: secret ANDROID_KEYSTORE_BASE64 is not set" >&2
            exit 1
          fi
          mkdir -p Car2Hass/.keys
          printf '%s' "$KEYSTORE_B64" | base64 -d > Car2Hass/.keys/release.jks

      - name: Build release APK
        working-directory: Car2Hass
        env:
          KEYSTORE_FILE: .keys/release.jks
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Stage APK and checksum
        run: |
          SRC=Car2Hass/app/build/outputs/apk/release/app-release.apk
          OUT="Car2Hass/Car2Hass_v${VERSION_NAME}.apk"
          cp "$SRC" "$OUT"
          (cd Car2Hass && sha256sum "Car2Hass_v${VERSION_NAME}.apk" > "Car2Hass_v${VERSION_NAME}.apk.sha256")
          ls -lh "$OUT" "$OUT.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: car2hass-apk-${{ env.VERSION_NAME }}
          path: |
            Car2Hass/Car2Hass_v*.apk
            Car2Hass/Car2Hass_v*.apk.sha256

      - name: Attach APK to release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "Car2Hass/Car2Hass_v${VERSION_NAME}.apk" \
            "Car2Hass/Car2Hass_v${VERSION_NAME}.apk.sha256" \
            --clobber
