# The app does not use AndroidX.
android.useAndroidX=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true

# Pin Gradle toolchain detection to the installed JDKs. /usr/lib/jvm/java-21-*
# is a JRE (no javac); when Gradle auto-detects it, AGP's javaCompiler capability
# check fails and the LSP's Gradle import errors out. JAVA_HOME stays JDK 17.
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.paths=/usr/lib/jvm/java-17-openjdk-amd64,/usr/lib/jvm/java-1.17.0-openjdk-amd64
